name: Pull Request Merge Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22.14.0"

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-governance:
    name: PR Merge Gate / Lint Typecheck Governance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install
        run: make install-ci
      - name: Install OpenAPI governance tooling
        run: npm ci
      - name: Verify Dependencies
        run: make verify-dependencies
      - name: Dependency Freshness
        run: make check-deps-strict
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: No Alias Contract Guard
        run: make no-alias-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Quality Baseline Freshness
        run: make quality-baseline-check
      - name: Dead Code Regression Gate
        run: make dead-code-gate
      - name: Duplicate Code Regression Gate
        run: make duplicate-code-gate
      - name: Trust Telemetry Freshness
        run: make trust-telemetry-freshness-gate
      - name: Checkout Lotus Platform Contracts
        uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-platform
          path: lotus-platform
      - name: Domain Data Products Gate
        env:
          LOTUS_PLATFORM_ROOT: ${{ github.workspace }}/lotus-platform
        run: make domain-data-products-gate
      - name: Observability Diagnostics
        run: make observability-diagnostics
      - name: Advisory Domain Golden Regressions
        run: make advisory-domain-golden-regressions
      - name: Migration Smoke
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit
      - name: Dependency Lock Gate
        run: make dependency-lock-gate
      - name: License IP Gate
        run: make license-ip-gate

  test-suites:
    name: PR Merge Gate / Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: python -m pytest ${{ matrix.path }} --cov=src --cov-report=
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    name: PR Merge Gate / Coverage Gate (Combined)
    needs: [test-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce coverage floor
        run: |
          python -m coverage combine coverage-data
          python -m coverage report --fail-under=97
      - name: Enforce changed source coverage floor
        if: github.event_name == 'pull_request'
        run: |
          python scripts/changed_coverage_gate.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --coverage-data .coverage \
            --policy quality/quality-policy.v1.json \
            --output output/changed-coverage-gate.json
      - name: Record changed coverage skip outside pull request
        if: github.event_name != 'pull_request'
        run: |
          python scripts/changed_coverage_gate.py \
            --policy quality/quality-policy.v1.json \
            --output output/changed-coverage-gate.json \
            --skip-reason "PR base/head refs are unavailable for this workflow event"
      - name: Upload changed coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-coverage-gate-evidence
          path: output/changed-coverage-gate.json
          if-no-files-found: error

  postgres-migration-smoke:
    name: PR Merge Gate / Postgres Migration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: lotus_advise
          POSTGRES_USER: lotus
          POSTGRES_PASSWORD: lotus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lotus -d lotus_advise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run Postgres migration smoke
        env:
          PROPOSAL_POSTGRES_DSN: postgresql://lotus:lotus@127.0.0.1:5432/lotus_advise
          PROPOSAL_POSTGRES_INTEGRATION_DSN: postgresql://lotus:lotus@127.0.0.1:5432/lotus_advise
        run: python scripts/run_runtime_smoke_checks.py postgres-migration-smoke

  production-profile-smoke:
    name: PR Merge Gate / Production Profile Startup Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: lotus_advise
          POSTGRES_USER: lotus
          POSTGRES_PASSWORD: lotus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lotus -d lotus_advise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run production profile startup smoke
        env:
          PROPOSAL_STORE_BACKEND: POSTGRES
          PROPOSAL_POSTGRES_DSN: postgresql://lotus:lotus@127.0.0.1:5432/lotus_advise
          PROPOSAL_POSTGRES_INTEGRATION_DSN: postgresql://lotus:lotus@127.0.0.1:5432/lotus_advise
        run: python scripts/run_runtime_smoke_checks.py production-profile-smoke

  production-profile-guardrail-negatives:
    name: PR Merge Gate / Production Profile Guardrail Negatives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run production guardrail negatives
        run: python scripts/run_runtime_smoke_checks.py production-profile-guardrail-negatives

  docker-build:
    name: PR Merge Gate / Validate Docker Build
    needs: [coverage-gate, postgres-migration-smoke, production-profile-smoke, production-profile-guardrail-negatives]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        env:
          CI_PIPELINE_ID: ${{ github.run_id }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: pr-not-pushed
        run: make docker-build
