name: Remote Feature Lane

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22.14.0"
  LOTUS_PLATFORM_REF: "5d9f9a2b142ff33a98b0e18b79dbe13738843dd6"

jobs:
  workflow-lint:
    name: Feature Lane / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  lint-dependency-governance:
    name: Feature Lane / Lint Dependency Governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install
        run: make install-ci
      - name: Install OpenAPI governance tooling
        run: npm ci
      - name: Verify Dependencies
        run: make verify-dependencies
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: No Alias Contract Guard
        run: make no-alias-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Proposal Decision Vocabulary Contract
        run: make proposal-decision-vocabulary-gate
      - name: Quality Baseline Freshness
        run: make quality-baseline-check
      - name: Quality Trend Regression Gate
        env:
          QUALITY_BASE_REF: origin/main
          QUALITY_HEAD_REF: HEAD
        run: make quality-trend-gate
      - name: Upload Quality Trend Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-trend-gate
          path: output/quality-trend-gate.json
          if-no-files-found: error
      - name: Dead Code Regression Gate
        run: make dead-code-gate
      - name: Duplicate Code Regression Gate
        run: make duplicate-code-gate
      - name: Unused Dependency Regression Gate
        run: make unused-dependency-gate
      - name: Upload Dependency Hygiene Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-hygiene-gate
          path: output/dependency-hygiene-gate.json
          if-no-files-found: error
      - name: Oversized Module/Function Regression Gate
        run: make oversized-code-gate
      - name: Upload Oversized Code Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oversized-code-gate
          path: output/oversized-code-gate.json
          if-no-files-found: error
      - name: Trust Telemetry Freshness
        run: make trust-telemetry-freshness-gate
      - name: Checkout Lotus Platform Contracts
        uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-platform
          ref: ${{ env.LOTUS_PLATFORM_REF }}
          path: lotus-platform
      - name: Wiki Quality Gate
        env:
          LOTUS_PLATFORM_ROOT: ${{ github.workspace }}/lotus-platform
          QUALITY_BASE_REF: origin/main
          QUALITY_HEAD_REF: HEAD
        run: make wiki-quality-gate
      - name: Domain Data Products Gate
        env:
          LOTUS_PLATFORM_ROOT: ${{ github.workspace }}/lotus-platform
        run: make domain-data-products-gate
      - name: Observability Diagnostics
        run: make observability-diagnostics
      - name: Advisory Domain Golden Regressions
        run: make advisory-domain-golden-regressions
      - name: Migration Smoke
        run: make migration-smoke
      - name: Bandit Severity Regression Gate
        run: make bandit-severity-regression-gate
      - name: Dependency Lock Gate
        run: make dependency-lock-gate
      - name: License IP Gate
        run: make license-ip-gate

  unit-tests:
    name: Feature Lane / Tests (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run unit tests
        run: make test-unit
