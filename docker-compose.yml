services:
  lotus-advise:
    build:
      context: .
      dockerfile: Dockerfile
    image: lotus-advise:latest
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOTUS_CORE_BASE_URL=${LOTUS_CORE_BASE_URL:-http://core-control.dev.lotus}
      - LOTUS_CORE_QUERY_BASE_URL=${LOTUS_CORE_QUERY_BASE_URL:-http://core-query.dev.lotus}
      - LOTUS_RISK_BASE_URL=${LOTUS_RISK_BASE_URL:-http://risk.dev.lotus}
      - LOTUS_REPORT_BASE_URL=${LOTUS_REPORT_BASE_URL:-http://report.dev.lotus}
      - LOTUS_REPORT_TIMEOUT_SECONDS=${LOTUS_REPORT_TIMEOUT_SECONDS:-30}
      - LOTUS_AI_BASE_URL=${LOTUS_AI_BASE_URL:-http://ai.dev.lotus}
      - LOTUS_AI_TIMEOUT_SECONDS=${LOTUS_AI_TIMEOUT_SECONDS:-30}
      - LOTUS_ADVISE_TENANT_ID=${LOTUS_ADVISE_TENANT_ID:?Set LOTUS_ADVISE_TENANT_ID for production-profile Advise runtime}
      - DPM_SUPPORTABILITY_STORE_BACKEND=${DPM_SUPPORTABILITY_STORE_BACKEND:-POSTGRES}
      - DPM_SUPPORTABILITY_POSTGRES_DSN=${DPM_SUPPORTABILITY_POSTGRES_DSN:-postgresql://advise:advise@postgres:5432/advise_supportability}
      - PROPOSAL_STORE_BACKEND=${PROPOSAL_STORE_BACKEND:-POSTGRES}
      - PROPOSAL_POSTGRES_DSN=${PROPOSAL_POSTGRES_DSN:-postgresql://advise:advise@postgres:5432/advise_supportability}
      - WORKSPACE_POSTGRES_DSN=${WORKSPACE_POSTGRES_DSN:-${PROPOSAL_POSTGRES_DSN:-postgresql://advise:advise@postgres:5432/advise_supportability}}
      - DPM_POLICY_PACK_CATALOG_BACKEND=${DPM_POLICY_PACK_CATALOG_BACKEND:-POSTGRES}
      - DPM_POLICY_PACK_POSTGRES_DSN=${DPM_POLICY_PACK_POSTGRES_DSN:-postgresql://advise:advise@postgres:5432/advise_supportability}
    extra_hosts:
      - "core-control.dev.lotus:host-gateway"
      - "core-query.dev.lotus:host-gateway"
      - "risk.dev.lotus:host-gateway"
      - "report.dev.lotus:host-gateway"
      - "ai.dev.lotus:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      - POSTGRES_DB=advise_supportability
      - POSTGRES_USER=advise
      - POSTGRES_PASSWORD=advise
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advise -d advise_supportability"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - advise-postgres-data:/var/lib/postgresql/data

volumes:
  advise-postgres-data:
